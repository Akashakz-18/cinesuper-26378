<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSuper - Movie Booking</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <h1>CineSuper</h1>
        <div id="auth-status">Checking login status...</div>
    </header>

    <main>
        <!-- Auth Section -->
        <section id="auth-section">
            <h2>Account Login</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
        </section>

        <!-- Movie List Section -->
        <section id="movies-section">
            <h2>Now Showing</h2>
            <div id="movie-list">Loading movies...</div>
        </section>

        <!-- Showtime Section -->
        <section id="showtimes-section">
            <h2>Available Showtimes</h2>
            <div id="showtime-list">Select a movie to view showtimes</div>
        </section>
    </main>

    <!-- Load JavaScript Configurations & Application Logic -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
